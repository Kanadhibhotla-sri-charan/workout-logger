<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Program - Workout Programmer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header id="app-header" class="app-header"></header>

  <main class="wide" id="main-content">
    <h1>Weekly program</h1>
    <div id="week-container"></div>

    <section>
      <h2>This week's goals</h2>
      <div id="goal-summary"></div>
    </section>
  </main>

  <div id="day-modal-root"></div>

  <script src="/app.js"></script>
  <script>
    renderAppHeader('/program.html');

    let weekData = null;
    let lastFocusedEl = null;

    // AI Programmer Discovery/Rehydration spec §5: incremented every
    // time a day's modal opens or closes, so an in-flight AI proposal
    // discovery request started for one modal can tell — when it
    // eventually resolves — whether IT is still the current modal or has
    // been superseded (modal closed, or a different day opened). Bumping
    // this on both open and close means a discovery started for day A
    // can never be mistaken for still-current after the modal was closed
    // entirely, not only after switching to a different day.
    let currentModalToken = 0;

    /** Bumps and returns the new `currentModalToken` — called from
     * `openDayModal` (a day just opened) and `closeDayModal` (the modal
     * just closed), so both events invalidate any request token
     * captured by a now-superseded `buildAiProposalSection` closure. */
    function bumpModalToken() {
      currentModalToken += 1;
      return currentModalToken;
    }

    /** True only if `token` (a value `bumpModalToken()` returned
     * earlier) is still the live token — i.e. the modal that requested
     * it is still open and still showing the same day. A pure,
     * side-effect-free check, deliberately kept separate from any DOM
     * code so it can be tested directly. */
    function isModalTokenCurrent(token) {
      return token === currentModalToken;
    }

    // AI Programmer Proposal Review UI: id -> display-name catalogs,
    // fetched once at page load, used only to resolve an AI proposal's
    // raw exerciseId/targetId to a real Blueprint name (see
    // buildAiExerciseCard below). A fetch failure here never blocks the
    // page — names simply fall back to their raw id.
    let blueprintExerciseNamesById = new Map();
    let blueprintTargetNamesById = new Map();
    let blueprintFunctionalGoalNamesById = new Map();

    async function loadAiNameCatalogs() {
      try {
        const [exercises, targets, functionalGoals] = await Promise.all([
          api('/api/blueprint/exercises'),
          api('/api/blueprint/targets'),
          api('/api/blueprint/functional-goals'),
        ]);
        blueprintExerciseNamesById = new Map(exercises.map((e) => [e.id, e.name]));
        blueprintTargetNamesById = new Map(targets.map((t) => [t.id, t.name]));
        blueprintFunctionalGoalNamesById = new Map(functionalGoals.map((g) => [g.id, g.name]));
      } catch {
        // Names fall back to raw ids (resolveExerciseDisplayName /
        // resolveTargetDisplayName below) — never blocks the page.
      }
    }

    function resolveExerciseDisplayName(exerciseId) {
      return blueprintExerciseNamesById.get(exerciseId) || exerciseId;
    }

    function resolveTargetDisplayName(targetType, targetId) {
      const map = targetType === 'functional_goal' ? blueprintFunctionalGoalNamesById : blueprintTargetNamesById;
      return map.get(targetId) || targetId;
    }

    // Blueprint Picker/Daily Activity spec §11: Gym/Badminton/Both/Rest,
    // matching the same labels used on the Profile page's weekly
    // schedule editor.
    const DAILY_ACTIVITY_OPTIONS = [
      { value: 'gym', text: 'Gym' },
      { value: 'badminton', text: 'Badminton' },
      { value: 'both', text: 'Both' },
      { value: 'unselected', text: 'Rest / clear' },
    ];
    function formatDailyActivity(activity) {
      return (DAILY_ACTIVITY_OPTIONS.find((o) => o.value === activity) || {}).text || activity;
    }

    async function loadWeek() {
      const container = document.getElementById('week-container');
      showLoading(container, 'Loading weekly program…');
      try {
        weekData = await api('/api/programming/week');
        renderWeek();
      } catch (err) {
        showError(container, "We couldn't load your weekly program.", loadWeek);
        showEmpty(document.getElementById('goal-summary'), 'Not enough information yet.');
      }
    }

    function renderWeek() {
      const container = document.getElementById('week-container');
      container.innerHTML = '';
      const hasAnyGymDay = weekData.days.some((d) => d.type === 'gym');
      if (!hasAnyGymDay) {
        const cta = el('a', { class: 'btn', href: '/profile.html', text: 'Set up training profile' });
        showEmpty(
          container,
          'A weekly program cannot be generated yet. Complete your training profile and add your goals.',
          cta
        );
        renderGoalSummary();
        return;
      }

      const grid = el('div', { class: 'week-grid' });
      for (const day of weekData.days) grid.appendChild(buildDayCard(day));
      container.appendChild(grid);
      renderGoalSummary();
    }

    function buildDayCard(day) {
      const isToday = day.date === todayIso();
      const btn = el('button', { class: 'week-day', type: 'button' });
      if (isToday) btn.setAttribute('aria-current', 'date');
      btn.setAttribute('aria-label', `${formatWeekday(day.weekday)} ${formatDate(day.date)} — ${day.type === 'gym' ? (day.sessionPurpose || 'gym') : formatSessionType(day.type)}`);

      const head = el('div', { class: 'wd-head' });
      head.appendChild(el('div', { class: 'wd-weekday', text: formatWeekday(day.weekday) }));
      head.appendChild(el('div', { class: 'wd-date', text: formatDate(day.date) }));
      const purposeText = day.type === 'gym' ? (day.sessionPurpose ? formatSessionType(day.sessionPurpose) : 'Gym') : formatSessionType(day.type);
      head.appendChild(
        el('div', { class: 'wd-purpose', text: day.activity === 'both' ? `${purposeText} + Badminton` : purposeText })
      );
      if (day.type === 'gym') {
        head.appendChild(el('div', { class: 'wd-meta', text: `${day.plannedWork.length} exercise${day.plannedWork.length === 1 ? '' : 's'} · ${formatDuration(day.estimatedMinutes)}` }));
      }
      btn.appendChild(head);
      const statusWord = day.type === 'gym' ? day.status : day.type;
      const statusLabel = day.type === 'gym' ? formatSessionType(day.status) : formatSessionType(day.type);
      btn.appendChild(createStatusBadge(statusWord, statusLabel));

      btn.addEventListener('click', () => openDayModal(day, btn));
      return btn;
    }

    function openDayModal(day, triggerEl) {
      const modalToken = bumpModalToken();
      lastFocusedEl = triggerEl;
      const root = document.getElementById('day-modal-root');
      root.innerHTML = '';

      const panel = el('div', { class: 'modal-panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': `${formatWeekday(day.weekday)} details` });
      const header = el('div', { class: 'modal-header' });
      const titleWrap = el('div');
      titleWrap.appendChild(el('div', { class: 'card-subtitle', text: formatDate(day.date, { weekday: 'long' }) }));
      titleWrap.appendChild(el('h2', { text: day.type === 'gym' ? formatSessionType(day.sessionPurpose || 'gym') : formatSessionType(day.type), style: 'margin:0.1rem 0 0' }));
      header.appendChild(titleWrap);
      const closeBtn = el('button', { class: 'modal-close', type: 'button', 'aria-label': 'Close' }, [document.createTextNode('×')]);
      closeBtn.addEventListener('click', closeDayModal);
      header.appendChild(closeBtn);
      panel.appendChild(header);
      panel.appendChild(buildChangeActivitySection(day));

      if (day.type === 'gym') {
        panel.appendChild(el('p', { class: 'faint', text: `Planned duration: ${formatDuration(day.estimatedMinutes)} of ${formatDuration(day.availableMinutes)} available` }));

        if (day.plannedWork.length === 0) {
          panel.appendChild(el('p', { class: 'muted', text: 'No exercises were placed on this day.' }));
        }
        for (const item of day.plannedWork) {
          panel.appendChild(buildExerciseDetailCard(item));
        }
        if (day.skipped && day.skipped.length > 0) {
          panel.appendChild(el('h3', { text: 'Unmet / dropped work' }));
          for (const s of day.skipped) {
            const card = createCard([
              el('div', { class: 'card-title', text: s.target_name || s.target_id }),
              el('div', { class: 'card-subtitle', text: s.friendly_reason || s.reason }),
            ]);
            panel.appendChild(card);
          }
        }
      } else {
        panel.appendChild(el('p', { class: 'muted', text: `No gym session planned — ${formatSessionType(day.type).toLowerCase()} day.` }));
      }

      panel.appendChild(buildAiProposalSection(day, modalToken));

      const backdrop = el('div', { class: 'modal-backdrop' }, [panel]);
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeDayModal();
      });
      document.addEventListener('keydown', onModalKeydown);
      root.appendChild(backdrop);
      closeBtn.focus();
    }

    function onModalKeydown(e) {
      if (e.key === 'Escape') closeDayModal();
    }

    function closeDayModal() {
      bumpModalToken(); // invalidate any still-in-flight discovery request for the now-closed modal
      document.getElementById('day-modal-root').innerHTML = '';
      document.removeEventListener('keydown', onModalKeydown);
      if (lastFocusedEl) lastFocusedEl.focus();
    }

    // Current-Week Reconciliation Fix §9/§11/§12/§13: an obvious way to
    // change a single day's activity from the existing weekly program —
    // WITHOUT a full profile-form resubmission or "regenerate the whole
    // week" action, and WITHOUT touching the recurring Training Profile
    // default at all. This writes a scoped override for the current
    // week only (PUT /api/programming/week/days/:day/activity, not the
    // training-profile endpoint), so it never silently changes what the
    // Profile page shows as this weekday's normal default. The change
    // takes effect immediately server-side (/week always recomputes
    // live from profile + this week's overrides) — this only re-fetches
    // the week to reflect it. On failure, the panel stays open with the
    // error shown and nothing is re-fetched (spec §12: no partial UI
    // update).
    function buildChangeActivitySection(day) {
      const section = el('div', { class: 'change-activity' });
      section.appendChild(el('p', { class: 'faint', text: `Current activity: ${formatDailyActivity(day.activity)}`, style: 'margin:0 0 0.4rem' }));
      section.appendChild(el('p', { class: 'faint', text: 'This changes only the current week — your recurring Training Profile schedule is unchanged.', style: 'margin:0 0 0.6rem' }));

      const select = el('select', { 'aria-label': 'Change activity (this week only)' },
        DAILY_ACTIVITY_OPTIONS.map((opt) => el('option', { value: opt.value, text: opt.text, ...(day.activity === opt.value ? { selected: 'selected' } : {}) }))
      );
      const statusEl = el('div');
      const saveBtn = createButton({ label: 'Change activity (this week)', variant: 'secondary', onClick: async () => {
        try {
          await withSaving(saveBtn, statusEl, () => api(`/api/programming/week/days/${day.weekday}/activity`, {
            method: 'PUT',
            body: { activity: select.value },
          }), 'Activity updated for this week.');
          closeDayModal();
          await loadWeek();
        } catch (err) { /* values preserved — panel stays open with the error shown */ }
      }});

      const row = el('div', { class: 'btn-row' }, [select, saveBtn]);
      section.append(row, statusEl);
      return section;
    }

    function buildExerciseDetailCard(item) {
      const card = createCard();
      card.classList.add('exercise-card');
      const header = el('div', { class: 'exercise-header' });
      const left = el('div');
      left.appendChild(el('div', { class: 'exercise-name', text: item.exercise_name }));
      left.appendChild(el('div', { class: 'exercise-targets', text: item.target_name }));
      header.appendChild(left);
      header.appendChild(el('div', { class: 'exercise-prescription', text: formatSets(item.sets, item.reps_min, item.reps_max) }));
      card.appendChild(header);

      const explain = el('details', { class: 'exercise-explanation' });
      explain.appendChild(el('summary', { text: 'Why included' }));
      explain.appendChild(el('p', { text: describeWork(item), style: 'margin:0.4rem 0' }));
      explain.appendChild(el('p', { class: 'faint', text: item.friendly_reasoning || item.reasoning, style: 'margin:0' }));
      card.appendChild(explain);

      return card;
    }

    // ---------- AI Programmer Proposal Review UI ----------
    // docs/CLAUDE_TASK_AI_PROGRAMMER_PROPOSAL_REVIEW_UI.md: a focused,
    // additive review panel for the single-session AI proposal
    // generate -> review -> approve -> commit workflow, scoped to
    // whichever day's modal is currently open. This never replaces or
    // recomputes anything the deterministic engine already rendered
    // above in this same modal — it is a separate, clearly-labeled
    // "awaiting review" surface using the existing AI Programmer API
    // (src/server/routes/aiProgrammer.ts) exactly as implemented,
    // nothing duplicated or re-validated client-side.

    const AI_STATUS_LABELS = { pending: 'Pending review', approved: 'Approved', committed: 'Committed', expired: 'Expired', rejected: 'Rejected' };
    function formatAiProposalStatus(status) {
      return AI_STATUS_LABELS[status] || capitalize(status);
    }

    function buildAiExerciseCard(item, pendingReview) {
      const card = createCard();
      card.classList.add('exercise-card');
      if (pendingReview) card.classList.add('exercise-unplanned'); // amber border — "not yet part of your real program"
      const header = el('div', { class: 'exercise-header' });
      const left = el('div');
      left.appendChild(el('div', { class: 'exercise-name', text: resolveExerciseDisplayName(item.exerciseId) }));
      left.appendChild(el('div', { class: 'exercise-targets', text: `${resolveTargetDisplayName(item.targetType, item.targetId)} · ${capitalize(item.role)}` }));
      header.appendChild(left);
      header.appendChild(el('div', { class: 'exercise-prescription', text: formatSets(item.sets, item.repsMin, item.repsMax) }));
      card.appendChild(header);

      const metaParts = [formatRirRange(item.rirMin, item.rirMax)];
      const restText = formatRestSeconds(item.restSeconds);
      if (restText) metaParts.push(restText);
      card.appendChild(el('p', { class: 'faint', text: metaParts.join(' · '), style: 'margin:0.25rem 0 0' }));

      if (item.rationale && item.rationale.length > 0) {
        const explain = el('details', { class: 'exercise-explanation' });
        explain.appendChild(el('summary', { text: 'Rationale' }));
        for (const r of item.rationale) explain.appendChild(el('p', { text: r, style: 'margin:0.2rem 0' }));
        card.appendChild(explain);
      }
      return card;
    }

    /** Renders the full read-only review content for a persisted
     * proposal record (the shared response shape GET/approve/commit all
     * return — see serializeProposal in src/server/routes/
     * aiProgrammer.ts). Never invents a field: every value shown here
     * comes directly from that response. */
    function buildAiProposalReview(state) {
      const wrap = el('div', { class: 'ai-proposal-panel' });
      const proposal = state.proposal;

      wrap.appendChild(el('div', { class: 'card-row' }, [
        el('div', { class: 'card-subtitle', text: formatDate(state.targetDate, { weekday: 'long' }) }),
        createStatusBadge(state.status, formatAiProposalStatus(state.status)),
      ]));
      if (state.createdAt) {
        wrap.appendChild(el('p', { class: 'faint', text: `Generated ${formatTimestamp(state.createdAt)}`, style: 'margin:0.2rem 0 0' }));
      }
      if (state.provider && state.model) {
        wrap.appendChild(el('p', { class: 'faint', text: `via ${state.provider} · ${state.model}`, style: 'margin:0.1rem 0 0' }));
      }
      if (proposal.sessionFocus && proposal.sessionFocus.length > 0) {
        wrap.appendChild(el('p', { class: 'muted', text: `Focus: ${proposal.sessionFocus.join(', ')}`, style: 'margin-top:0.5rem' }));
      }

      const pendingReview = state.status === 'pending' || state.status === 'approved';
      for (const ex of proposal.exercises) wrap.appendChild(buildAiExerciseCard(ex, pendingReview));

      if (proposal.programmingRationale && proposal.programmingRationale.length > 0) {
        const details = el('details', { class: 'exercise-explanation' });
        details.appendChild(el('summary', { text: 'Programming rationale' }));
        for (const r of proposal.programmingRationale) details.appendChild(el('p', { text: r, style: 'margin:0.25rem 0' }));
        wrap.appendChild(details);
      }
      if (proposal.warnings && proposal.warnings.length > 0) {
        const warnBlock = el('div', { class: 'card card-warning', role: 'status' });
        for (const w of proposal.warnings) warnBlock.appendChild(el('p', { text: `Warning: ${w}`, style: 'margin:0.15rem 0' }));
        wrap.appendChild(warnBlock);
      }
      return wrap;
    }

    /** The Generate -> Review -> Approve -> Commit workflow for one
     * day's modal — now preceded by a discovery step (Discovery/
     * Rehydration spec §4) so a proposal already generated for this date
     * in an earlier modal session is found and restored, rather than the
     * UI only ever knowing about a proposal it created itself in the
     * current closure. `state` still lives only in this closure — but it
     * is now SEEDED from the backend on open rather than always starting
     * `null`. `aiProposalActionsFor` (app.js) remains the single source
     * of truth for which action is available for a given status; this
     * function only wires it to actual DOM/network calls.
     *
     * `modalToken` is the value `currentModalToken` had at the moment
     * THIS modal opened (see openDayModal). It is captured once, in the
     * closure, and compared against the live `currentModalToken` inside
     * every async continuation below (spec §5: "prevent overlapping
     * discovery requests from causing an older response to overwrite a
     * newer selected date") — if they no longer match, this modal was
     * closed or replaced by a different day's modal while the request
     * was in flight, and the response is discarded rather than applied
     * to (now-detached, but still checked defensively) DOM. */
    function buildAiProposalSection(day, modalToken) {
      const section = el('div', { class: 'ai-proposal-section' });
      section.appendChild(el('h3', { text: 'AI Workout Proposal' }));

      const locked = day.status === 'completed' || day.status === 'in_progress';
      if (locked) {
        section.appendChild(el('p', { class: 'faint', text: `AI proposals aren't available — this day already has a ${formatSessionType(day.status).toLowerCase()} workout.` }));
        return section;
      }

      section.appendChild(el('p', { class: 'faint', text: 'Generate an AI-suggested session for this day. Nothing is added to your program until you explicitly approve and commit it.' }));

      let state = null;
      let inFlight = false;
      // Gates action rendering until discovery resolves — never shows
      // "Generate" (or any other action) while it's still unknown
      // whether an active proposal already exists for this date, which
      // is what prevents an accidental duplicate generation (spec §6).
      let discoveryDone = false;
      const noticeEl = el('div');
      const reviewEl = el('div');
      const actionsEl = el('div');
      const statusEl = el('div');
      section.append(noticeEl, reviewEl, actionsEl, statusEl);

      function isCurrent() {
        return isModalTokenCurrent(modalToken);
      }

      function renderReview() {
        reviewEl.innerHTML = '';
        if (state) reviewEl.appendChild(buildAiProposalReview(state));
      }

      /** Discovery/Rehydration spec §4's "expired/rejected proposal
       * found" case: a small, non-blocking note — never prevents
       * Generate from showing (aiProposalActionsFor already treats
       * expired/rejected the same as "no proposal" for that purpose). */
      function renderNotice() {
        noticeEl.innerHTML = '';
        const notice = aiProposalNoticeFor(state ? state.status : null);
        if (notice) noticeEl.appendChild(el('p', { class: 'faint', text: notice }));
      }

      function renderActions() {
        actionsEl.innerHTML = '';
        if (!discoveryDone) {
          actionsEl.appendChild(el('p', { class: 'faint', text: 'Checking for an existing proposal…' }));
          return;
        }
        const actions = aiProposalActionsFor(state ? state.status : null);

        if (actions.canGenerate) {
          const label = state ? 'Generate a new proposal' : 'Generate AI Workout Proposal';
          actionsEl.appendChild(createButton({ label: inFlight ? 'Generating…' : label, disabled: inFlight, onClick: onGenerate }));
          return;
        }
        if (actions.canApprove) {
          actionsEl.appendChild(el('div', { class: 'btn-row' }, [
            createButton({ label: inFlight ? 'Approving…' : 'Approve Proposal', variant: 'secondary', disabled: inFlight, onClick: onApprove }),
          ]));
          return;
        }
        if (actions.canCommit) {
          actionsEl.appendChild(el('p', { class: 'muted', text: 'Approved — not yet added to your program.' }));
          actionsEl.appendChild(el('div', { class: 'btn-row' }, [
            createButton({ label: inFlight ? 'Committing…' : 'Commit to Planned Workout', disabled: inFlight, onClick: onCommit }),
          ]));
          return;
        }
        if (actions.isCommitted) {
          actionsEl.appendChild(el('p', { class: 'muted', text: 'Committed — this is now a real planned workout.' }));
          if (state.committedSessionId) {
            actionsEl.appendChild(el('a', { class: 'btn btn-secondary', href: `/logger.html?session=${state.committedSessionId}`, text: 'Open planned workout' }));
          }
        }
      }

      /** Discovery/Rehydration spec §2/§4: on open, ask the backend
       * whether a proposal already exists for this date (the backend,
       * never client-side memory, remains authoritative — spec §5) and
       * seed `state` from it before any action is offered. A discovery
       * failure degrades to "no known proposal" (offers a fresh
       * Generate) rather than blocking the day entirely — a transient
       * discovery failure must not make the day unusable. */
      async function discover() {
        try {
          const result = await aiApi(`/api/ai-programmer/proposals/latest?targetDate=${encodeURIComponent(day.date)}`);
          if (!isCurrent()) return; // superseded — a newer/closed modal, discard
          state = result.found ? result : null;
        } catch (err) {
          if (!isCurrent()) return;
          state = null;
          showInlineStatus(statusEl, 'error', err.message);
        } finally {
          if (!isCurrent()) return;
          discoveryDone = true;
          renderReview();
          renderNotice();
          renderActions();
        }
      }

      /** Re-fetches the canonical server state after a failed approve/
       * commit — a failure can mean the proposal's real status already
       * moved on (e.g. it expired, or another request already
       * committed it), and the UI must never keep showing stale
       * buttons for a status that no longer exists (spec §3: "do not
       * silently retry an operation that could create an unintended
       * state transition" — this is the opposite: resyncing display,
       * never re-attempting the action itself). */
      async function resyncState() {
        try {
          state = await aiApi(`/api/ai-programmer/proposals/${state.proposalId}`);
        } catch {
          state = null; // the proposal itself is gone/unreachable — offer a fresh Generate
        }
      }

      async function onGenerate() {
        if (inFlight) return;
        inFlight = true;
        showInlineStatus(statusEl, 'saving', 'Generating…');
        renderActions();
        try {
          const generated = await aiApi('/api/ai-programmer/generate-session', { method: 'POST', body: { targetDate: day.date } });
          const fresh = await aiApi(`/api/ai-programmer/proposals/${generated.proposalId}`);
          if (!isCurrent()) return;
          state = fresh;
          showInlineStatus(statusEl, null, null);
        } catch (err) {
          if (!isCurrent()) return;
          showInlineStatus(statusEl, 'error', err.message);
        } finally {
          if (!isCurrent()) return;
          inFlight = false;
          renderReview();
          renderNotice();
          renderActions();
        }
      }

      async function onApprove() {
        if (inFlight || !state) return;
        inFlight = true;
        showInlineStatus(statusEl, 'saving', 'Approving…');
        renderActions();
        try {
          const approved = await aiApi(`/api/ai-programmer/proposals/${state.proposalId}/approve`, { method: 'POST' });
          if (!isCurrent()) return;
          state = approved;
          showInlineStatus(statusEl, null, null);
        } catch (err) {
          if (!isCurrent()) return;
          showInlineStatus(statusEl, 'error', err.message);
          await resyncState();
        } finally {
          if (!isCurrent()) return;
          inFlight = false;
          renderReview();
          renderNotice();
          renderActions();
        }
      }

      async function onCommit() {
        if (inFlight || !state) return;
        inFlight = true;
        showInlineStatus(statusEl, 'saving', 'Committing…');
        renderActions();
        try {
          const committed = await aiApi(`/api/ai-programmer/proposals/${state.proposalId}/commit`, { method: 'POST' });
          if (!isCurrent()) return;
          state = committed;
          showInlineStatus(statusEl, null, null);
        } catch (err) {
          if (!isCurrent()) return;
          showInlineStatus(statusEl, 'error', err.message);
          await resyncState();
        } finally {
          if (!isCurrent()) return;
          inFlight = false;
          renderReview();
          renderNotice();
          renderActions();
        }
      }

      renderActions(); // shows the "Checking…" placeholder immediately
      discover();
      return section;
    }

    const GROUP_ORDER = ['Goal 1', 'Goal 2', 'Normal development', 'Maintenance'];

    function renderGoalSummary() {
      const container = document.getElementById('goal-summary');
      container.innerHTML = '';
      if (!weekData.targetAllocations || weekData.targetAllocations.length === 0) {
        showEmpty(container, 'Not enough information yet.');
        return;
      }

      const groups = new Map();
      for (const a of weekData.targetAllocations) {
        const label = a.goal_label || 'Other';
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(a);
      }
      const orderedLabels = [...groups.keys()].sort((a, b) => {
        const ai = GROUP_ORDER.indexOf(a);
        const bi = GROUP_ORDER.indexOf(b);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });

      const grid = el('div', { class: 'summary-grid' });
      for (const label of orderedLabels) {
        const allocations = groups.get(label);
        const required = allocations.reduce((sum, a) => sum + a.requiredDirectSets, 0);
        // Final Surgical Fix Pass §13-16: `deliveredDirectSets` is a
        // PROGRAMMING concept (what survived resource/time fitting into
        // the final program), never a claim about actual workout
        // completion — that distinction lives only in the Logger's own
        // real Planned-vs-Actual display. The backend field name is
        // unchanged (spec §16); only this presentation-time local is
        // named/labeled "Programmed".
        const programmed = allocations.reduce((sum, a) => sum + a.deliveredDirectSets, 0);
        const unmet = allocations.reduce((sum, a) => sum + a.unmetDirectSets, 0);
        const pct = required > 0 ? Math.min(100, Math.round((programmed / required) * 100)) : 0;

        const card = createCard();
        card.appendChild(el('div', { class: 'card-title', text: label }));
        card.appendChild(el('div', { class: 'card-subtitle', text: `Required: ${required} · Programmed: ${programmed}${unmet > 0 ? ` · Unmet: ${unmet}` : ''}` }));
        const track = el('div', { class: 'summary-bar-track' });
        track.appendChild(el('div', { class: 'summary-bar-fill', style: `width:${pct}%` }));
        card.appendChild(track);
        grid.appendChild(card);
      }
      container.appendChild(grid);
    }

    loadWeek();
    loadAiNameCatalogs();
  </script>
</body>
</html>
