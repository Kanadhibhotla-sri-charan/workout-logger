# Deployment Phase §22-24. Replace <DEPLOYMENT_HOSTNAME> with the real
# hostname before installing (e.g. into /etc/nginx/sites-available/
# workout-logger, symlinked into sites-enabled/). Certbot will rewrite
# this file to add the HTTPS server block/redirect (spec §25) — do not
# hand-add a self-signed HTTPS block here first.
server {
    listen 80;
    server_name <DEPLOYMENT_HOSTNAME>;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cross-Week Programming Intelligence Fix: nginx's own default
        # proxy_read_timeout (60s) was racing the app's own Velona
        # provider timeout (VELONA_TIMEOUT_MS, default 60000ms) on the
        # AI Programmer's generate-session/reconcile-week endpoints —
        # nginx was winning the race and returning its own generic
        # default error page (a 502/504 with no JSON body) before the
        # app's own structured, typed error ever had a chance to reach
        # the client. The app's own real worst case is bounded by
        # (VELONA_MAX_RETRIES + 1) * VELONA_TIMEOUT_MS plus a small
        # retry delay — with the documented defaults (1 retry, 60s
        # timeout) that is ~120.3s. 150s safely exceeds that worst case
        # regardless of which of the two documented defaults an
        # operator has actually configured in the environment.
        proxy_read_timeout 150s;
    }
}
