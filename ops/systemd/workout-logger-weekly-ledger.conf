# Weekly volume ledger (docs/WEEKLY_VOLUME_PLANNING_DESIGN.md). 'on' since
# 2026-10-27: the ledger drives each session (planning/ledgerBrief.ts);
# 'shadow' only logs it. Rollback to the old planner: set shadow, restart.
# systemd drop-in for workout-logger.service:
#   /etc/systemd/system/workout-logger.service.d/weekly-ledger.conf
# 'shadow' logs the ledger next to every session plan
# ("[ai-programmer] weekly ledger shadow"); generation is unchanged.
# Rollback: delete this file, daemon-reload, restart.
[Service]
Environment=AI_WEEKLY_LEDGER_MODE=on
