# Calorie Tracker sync (docs/CALORIE_TRACKER_INTEGRATION.md, "Pushed
# file"). systemd drop-in for workout-logger.service:
#   /etc/systemd/system/workout-logger.service.d/calorie-sync.conf
#
# calorie-sync.env (not secret):
#   CALORIE_SYNC_BRANCH=<branch the live Calorie Tracker app reads>
# calorie-sync-token.env (SECRET, chmod 600, written on the VM only, never
# in Git or chat):
#   CALORIE_SYNC_TOKEN=<fine-grained token: food_and_workout_tracker only,
#                       Contents read and write>
# The leading "-" lets the service start (with sync off) when a file is
# missing.
[Service]
EnvironmentFile=-/home/ubuntu/.config/workout-logger/calorie-sync.env
EnvironmentFile=-/home/ubuntu/.config/workout-logger/calorie-sync-token.env
